    [['concrete','Concrete pad'],['generator','Generator'],['fuel','Fuel tank'],['ats','Transfer switch'],['crane','For the crane']].forEach(([t, name]) => {
      const rows = planFacts(t, data); if(!rows.length) return;
      any = true; h += `<h4 class="fact-h">${esc(name)}</h4>${factsDL(rows)}`;
      if(t === 'concrete') h += checksHTML(padChecks(data));
    });
    if(!any) h += `<p class="muted">No sizes, weights or capacities turned up in these documents.</p>`;
    h += discrepanciesHTML(data.conflicts);
    if(!(d.name || '').trim()) h += `<p class="err" style="font-weight:500">Add the project name above so these results are saved.</p>`;
    if(any) h += `<p class="hint">Double-check anything that goes into a lift plan.</p>`;
    h += `</div>`;
  }
  h += planFileLinks(pl.files, true);
  return h + `</section>`;
}
function plansBlockHTML(step){
  const d = S.wiz.draft, pl = d.plans || {}, data = pl.data;
  if(!data){
    if(PU && PU.canSample === false) return '';
    return `<p class="plans-hint">Upload plans and submittals on <button class="linkbtn" data-act="wiz-goto" data-i="0">step 1</button> and this step fills in on its own.</p>`;
  }
  const facts = planFacts(step.type, data);
  let h = `<section class="plans" aria-labelledby="plans-h"><div class="plans-head"><div><h3 id="plans-h">From the plans</h3><p class="muted" style="font-size:14.5px">${reviewedLine(pl)} <button class="linkbtn" data-act="wiz-goto" data-i="0">Change on step 1</button></p></div></div>`;
  h += facts.length ? factsDL(facts) : `<p class="muted">Nothing for this step turned up in the pages reviewed.</p>`;
  if(step.type === 'concrete') h += checksHTML(padChecks(data));
  const rel = (data.conflicts || []).filter(t => CONFLICT_WORDS[step.type] && CONFLICT_WORDS[step.type].test(t));
  if(rel.length) h += discrepanciesHTML(rel);
  if(facts.length) h += `<p class="hint">Empty fields below were filled in from the plans. “Fill from plans” on a block replaces its values with the plans’ values.</p>`;
  return h + `</section>`;
}
function projectPlansHTML(p){
  const pl = p.plans || {};
  if(!pl.data && !(pl.files || []).length){
    return IN_CLAUDE ? `<h2 class="sec-h" style="margin-top:30px">Plans</h2><p class="note">No plans reviewed yet. <button class="linkbtn" data-act="edit-step" data-pid="${esc(p.id)}" data-step="job" data-item="">Upload plans</button> to fill in pad, equipment and tank details.</p>` : '';
  }
  const seen = new Set(), rows = [];
  ['concrete','generator','fuel','crane'].forEach(t => planFacts(t, pl.data).forEach(r => { if(!seen.has(r.label) && rows.length < 18){ seen.add(r.label); rows.push(r); } }));
  let h = `<h2 class="sec-h" style="margin-top:30px">Plans</h2>`;
  if(pl.data) h += `<p class="muted" style="font-size:14.5px">Reviewed ${esc(pl.reviewedAt ? fmtShort(toISO(new Date(pl.reviewedAt))) : '')} from ${esc(sourcesText(pl.reviewedFrom) || 'your plans')}.</p>`;
  if(rows.length) h += factsDL(rows);
  if(pl.data) h += checksHTML(padChecks(pl.data)) + discrepanciesHTML(pl.data.conflicts);
  h += planFileLinks(pl.files, false);
  h += `<p style="margin-top:12px"><button class="linkbtn" data-act="edit-step" data-pid="${esc(p.id)}" data-step="job" data-item="">Review plans</button></p>`;
  return h;
}

/* ---------- Calendar file (.ics inside a .zip) ---------- */
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc = new TextEncoder(); let out = '', cur = '', bytes = 0;
  for(const ch of line){ const b = enc.encode(ch).length; if(bytes + b > (out ? 74 : 75)){ out += (out ? '\r\n ' : '') + cur; cur = ''; bytes = 0; } cur += ch; bytes += b; }
  return out ? out + '\r\n ' + cur : cur;
}
const icsDate = iso => iso.replace(/-/g,'');
function icsDT(iso, time, addMin){
  const [h, mi] = (time || '08:00').split(':').map(Number);
  const d = parseISO(iso); d.setHours(h, mi + (addMin||0), 0, 0);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function buildICS(){
  const t = todayISO(), now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lead Time//Project reminders//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Lead Time project reminders'];
  let n = 0;
  allEvents().filter(ev => !ev.inactive && !ev.done && ev.date >= t).forEach(ev => {
    const p = ev.project, desc = detailLines(ev).join('\n');
    const uidBase = `${p.id}-${ev.id}`.replace(/[^A-Za-z0-9_.-]/g,'');
    L.push('BEGIN:VEVENT', `UID:${uidBase}@leadtime`, `DTSTAMP:${stamp}`);
    if(ev.time) L.push(`DTSTART:${icsDT(ev.date, ev.time)}`, `DTEND:${icsDT(ev.date, ev.time, 60)}`);
    else L.push(`DTSTART;VALUE=DATE:${icsDate(ev.date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(ev.date,1))}`);
    L.push(`SUMMARY:${icsEsc(ev.title + ': ' + p.name)}`);
    if(p.siteAddress) L.push(`LOCATION:${icsEsc(p.siteAddress)}`);
    L.push(`DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT', 'END:VEVENT'); n++;
    if(ev.noRemind) return;
    const rs = remState(ev);
    rs.ticks.filter(x => x.st === 'upcoming' && x.rd >= t).forEach(x => {
      L.push('BEGIN:VEVENT', `UID:${uidBase}-r${x.o}@leadtime`, `DTSTAMP:${stamp}`,
        `DTSTART:${icsDT(x.rd, S.settings.remindTime)}`, `DTEND:${icsDT(x.rd, S.settings.remindTime, 15)}`,
        `SUMMARY:${icsEsc(`Reminder: ${ev.title} in ${offLong(x.o)} (${p.name})`)}`,
        `DESCRIPTION:${icsEsc(`${ev.title} is ${offLong(x.o)} away, on ${fmtLong(ev.date)}.\n\n` + desc)}`,
        'TRANSP:TRANSPARENT',
        'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('Reminder: ' + ev.title)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'); n++;
    });
  });
  L.push('END:VCALENDAR');
  return {text: L.map(icsFold).join('\r\n') + '\r\n', count:n};
}
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let i = 0; i < 256; i++){ let c = i; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipOne(name, text){
  const enc = new TextEncoder(), nm = enc.encode(name), data = enc.encode(text), crc = crc32(data), d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth()+1) << 5) | d.getDate();
  const lh = new DataView(new ArrayBuffer(30)), cd = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,time,true); lh.setUint16(12,date,true);
  lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
  cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint16(8,0x0800,true); cd.setUint16(10,0,true); cd.setUint16(12,time,true); cd.setUint16(14,date,true);
  cd.setUint32(16,crc,true); cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true); cd.setUint16(28,nm.length,true); cd.setUint16(30,0,true); cd.setUint16(32,0,true); cd.setUint16(34,0,true); cd.setUint16(36,0,true); cd.setUint32(38,0,true); cd.setUint32(42,0,true);
  const cdOff = 30 + nm.length + data.length, cdSize = 46 + nm.length;
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true); end.setUint16(8,1,true); end.setUint16(10,1,true); end.setUint32(12,cdSize,true); end.setUint32(16,cdOff,true); end.setUint16(20,0,true);
  return new Blob([lh.buffer, nm, data, cd.buffer, nm, end.buffer], {type:'application/zip'});
}
// When the page runs as a file on your own computer (outside Claude), use a normal browser download.
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
function browserDownload(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.json') ? 'application/json' : filename.endsWith('.ics') ? 'text/calendar' : 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function saveFile(filename, data, okMsg){
  const dl = await useCap('downloads');
  if(!dl){
    try{ browserDownload(filename, data); toast(okMsg); }
    catch(e){ toast('The file couldn’t be saved. Try again.'); }
    return;
  }
  try{ await dl.save({filename, data}); toast(okMsg); }
  catch(e){
    const c = e && e.code;
    if(c === 'declined') return;
    if(c === 'rate_limited') toast('A download is already waiting for your OK.');
    else if(c === 'extension_not_enabled' || c === 'rejected_extension') toast('That file type can’t be downloaded here.');
    else toast('The file couldn’t be saved. Try again.');
  }
}
async function exportCalendar(){
  const ics = buildICS();
  if(!ics.count){ toast('There are no upcoming dates to add yet.'); return; }
  if(!IN_CLAUDE){ await saveFile('lead-time-reminders.ics', ics.text, 'Saved. Open lead-time-reminders.ics to add the dates to your calendar.'); return; }
  await saveFile('lead-time-calendar.zip', zipOne('lead-time-reminders.ics', ics.text), 'Saved. Unzip it, then open lead-time-reminders.ics to add the dates to your calendar.');
}
async function backup(){
  const data = JSON.stringify({app:'lead-time', version:1, exportedAt:new Date().toISOString(), settings:S.settings, projects:Object.values(S.projects)}, null, 2);
  await saveFile(`lead-time-backup-${todayISO()}.json`, data, 'Backup saved.');
}
$('#import-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj; try{ obj = JSON.parse(r.result); }catch(err){ toast('That file isn’t a Lead Time backup.'); return; }
    const list = Array.isArray(obj.projects) ? obj.projects : (obj.projects && typeof obj.projects === 'object' ? Object.values(obj.projects) : null);
    if(!list){ toast('That file isn’t a Lead Time backup.'); return; }
    let n = 0;
    list.forEach(p => {
      if(!p || typeof p !== 'object' || !p.name) return;
      const q = Object.assign(newProject(), p);
      if(!SAFE_ID.test(String(q.id))) q.id = uid('p');
      q.milestones = Array.isArray(q.milestones) ? q.milestones.filter(m => m && TYPES[m.type]).map(m => Object.assign({}, m, {id: SAFE_ID.test(String(m.id)) ? m.id : uid('m')})) : [];
      q.stakeholders = Array.isArray(q.stakeholders) ? q.stakeholders.filter(s => s && typeof s === 'object').map(s => Object.assign({}, s, {id: SAFE_ID.test(String(s.id)) ? s.id : uid('s')})) : [];
      writeProject(q); n++;
    });
    if(obj.settings && typeof obj.settings === 'object'){ S.settings = Object.assign(clone(DEFAULT_SETTINGS), obj.settings); writeSettings(); }
    toast(n ? `Restored ${plural(n,'project')}.` : 'No projects found in that file.');
  };
  r.readAsText(file);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset, act = a.act;
  if(el.tagName === 'BUTTON') e.preventDefault();
  switch(act){
    case 'tab': if(S.wiz) return; go(a.view); break;
    case 'new-project': openWizard(null); break;
    case 'example': addExample(); break;
    case 'open-project': S.projectId = a.id; go('project'); break;
    case 'edit-step': openWizard(a.pid, a.step, a.item); break;
    case 'rem-email': handleRem(a.key, Number(a.off), 'sent'); if(!modalEl.hidden) setTimeout(closeModal, 300); break;
    case 'rem-dismiss': handleRem(a.key, Number(a.off), 'dismissed'); break;
    case 'rem-preview': { const ev = S.evIndex[a.key]; if(ev){ const rs = remState(ev); emailModal(emailFor(ev, rs), rs.due ? a.key : '', rs.due ? rs.due.o : 0); } break; }
    case 'digest-preview': emailModal(digestEmail()); break;
    case 'modal-copy': copyText(modalText); break;
    case 'modal-close': closeModal(); break;
    case 'modal-close-soon': setTimeout(closeModal, 300); break;
    case 'toast-action': { const f = toastFn; toastEl.hidden = true; toastFn = null; if(f) f(); break; }
    case 'toggle-done': toggleDone(a.pid, a.eid); break;
    case 'complete-project': { const p = clone(S.projects[a.id]); p.status = p.status === 'complete' ? 'active' : 'complete'; writeProject(p); toast(p.status === 'complete' ? 'Project marked complete. Its reminders are off.' : 'Project reopened.'); break; }
    case 'delete-project': { const p = S.projects[a.id]; if(!p) return; showModal(`<h2>Delete ${esc(p.name || 'this project')}?</h2><p class="muted">This removes the project and all of its dates, stakeholders and reminders. You’ll have a few seconds to undo.</p><div class="btns"><button class="btn btn-primary" style="background:var(--alert);border-color:var(--alert)" data-act="delete-confirm" data-id="${esc(a.id)}">Delete project</button><button class="btn" data-act="modal-close" data-autofocus>Keep it</button></div>`); break; }
    case 'delete-confirm': {
      const copy = S.projects[a.id] ? clone(S.projects[a.id]) : null;
      closeModal();
      if(S.wiz && S.wiz.draft.id === a.id){ S.wiz = null; renderWizard(); }
      removeProject(a.id);
      if(S.view === 'project') S.view = 'projects';
      render();
      toast(`Deleted ${copy && copy.name ? copy.name : 'project'}.`, copy ? {label:'Undo', fn:() => { writeProject(copy); toast('Project restored.'); }} : null);
      break;
    }
    case 'cal-move': { const [y, m] = S.calMonth.split('-').map(Number); const d = new Date(y, m-1+Number(a.n), 1); S.calMonth = toISO(d).slice(0,7); S.calSel = toISO(d); render(); break; }
    case 'cal-today': S.calMonth = todayISO().slice(0,7); S.calSel = todayISO(); render(); break;
    case 'cal-day': { S.calSel = a.date; if(a.date.slice(0,7) !== S.calMonth) S.calMonth = a.date.slice(0,7); render(); const b = mainEl.querySelector(`[data-date="${a.date}"]`); if(b) b.focus({preventScroll:true}); if(window.innerWidth < 680){ const dp = $('.day-panel'); if(dp) dp.scrollIntoView({behavior:'smooth', block:'start'}); } break; }
    case 'off-remove': S.settings.offsets = offsets().filter(o => o !== Number(a.o)); writeSettings(); break;
    case 'off-add': { const inp = $('#off-new'); const v = Math.round(Number(inp && inp.value)); if(!v || v < 1 || v > 365){ toast('Enter a number of days between 1 and 365.'); if(inp) inp.focus(); return; } S.settings.offsets = [...offsets(), v]; writeSettings(); break; }
    case 'off-reset': S.settings.offsets = [30,14,7,2]; writeSettings(); break;
    case 'export-ics': exportCalendar(); break;
    case 'backup': backup(); break;
    case 'import': $('#import-file').click(); break;
    case 'apikey-save': { const inp = $('#set-apikey'); const v = (inp && inp.value || '').trim(); if(!v){ toast('Paste your Anthropic API key first.'); if(inp) inp.focus(); return; } if(setApiKey(v)){ render(); toast('API key saved in this browser. Plan review is on.'); } else toast('This browser blocked saving the key.'); break; }
    case 'apikey-remove': setApiKey(''); render(); toast('API key removed from this browser.'); break;
    case 'wiz-goto': wizGo(Number(a.i)); break;
    case 'wiz-next': wizGo(S.wiz.step + 1); break;
    case 'wiz-back': S.wiz.error = ''; persistDraft(); S.wiz.step--; S.wiz.focusItem = null; ensureItem(); renderWizard(true); break;
    case 'wiz-close': if(S.wiz.isNew && !(S.wiz.draft.name||'').trim()){ S.wiz = null; renderWizard(); } else closeWizard(S.wiz.startedNew); break;
    case 'wiz-finish': if(validateStep()){ const isNew = !S.projects[S.wiz.draft.id]; closeWizard(true); toast(isNew ? 'Project saved. Reminders are set.' : 'Project saved.'); } break;
    case 'wiz-add': { const s = STEPS[S.wiz.step]; const it = addItem(s); S.wiz.focusItem = it.id; renderWizard(); break; }
    case 'wiz-quick': { const s = STEPS[S.wiz.step]; const items = listFor(s, S.wiz.draft); const ex = items.find(it => (it.inspType||'').trim() === a.v); if(ex){ S.wiz.focusItem = ex.id; } else { const it = addItem(s, {inspType:a.v, status:'Not scheduled'}); S.wiz.focusItem = it.id; } renderWizard(); break; }
    case 'plans-upload': $('#plans-file').click(); break;
    case 'plans-review': reviewPlans(); break;
    case 'plans-stop': if(PU && PU.ctl) PU.ctl.abort(); break;
    case 'plans-drop': if(PU){ PU.files = PU.files.filter(f => f.key !== a.f); renderWizardKeepFocus(); } break;
    case 'plans-remove': removeStoredPlan(a.id); break;
    case 'plan-apply': applyPlans(a.id); break;
    case 'plans-undo': undoFill(); break;
    case 'plans-use': useConflict(Number(a.i)); break;
    case 'plans-use-all': useConflict(null); break;
    case 'wiz-remove': { const d = S.wiz.draft; d.milestones = d.milestones.filter(x => x.id !== a.id); d.stakeholders = d.stakeholders.filter(x => x.id !== a.id); renderWizard(); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset && el.dataset.change; if(!c) return;
  if(c === 'cal-rem'){ S.calRem = el.checked; render(); }
  else if(c === 'set-email'){ S.settings.email = el.value.trim(); writeSettings(); toast('Email saved.'); }
  else if(c === 'set-time'){ S.settings.remindTime = el.value || '08:00'; writeSettings(); }
  else if(c === 'set-stake'){ S.settings.includeStakeholders = el.checked; writeSettings(); }
  else if(c === 'set-fdep'){ const n = Math.round(Number(el.value)); S.settings.fdepThreshold = n > 0 ? n : 549; writeSettings(); toast(`FDEP threshold set to ${fmtNum(S.settings.fdepThreshold)} gallons.`); }
  else if(c === 'wiz-jump'){ const i = Number(el.value); wizGo(i); if(S.wiz && S.wiz.step !== i){ el.value = String(S.wiz.step); } }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(!modalEl.hidden){ closeModal(); return; }
  if(S.wiz){ if(S.wiz.isNew && !(S.wiz.draft.name||'').trim()){ S.wiz = null; renderWizard(); } else closeWizard(false); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'off-new'){ e.preventDefault(); const b = mainEl.querySelector('[data-act="off-add"]'); if(b) b.click(); }
});

// Keep "Today" accurate if the page stays open past midnight
let lastDay = todayISO();
setInterval(() => { const t = todayISO(); if(t !== lastDay){ lastDay = t; renderSoft(); } }, 60000);

initStorage();
})();

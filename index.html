<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Time: project dates and reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface-2:#F4F5F4; --ink:#1D2226; --muted:#5C6770;
  --rule:#D3D7D5; --rule-strong:#9AA3A8;
  --signal:#F4C20D; --signal-ink:#1D2226; --signal-soft:#FFF3C2;
  --action:#1D5FA6; --action-ink:#FFFFFF; --alert:#B42318; --alert-soft:#FCEBE9;
  --c-coord:#3D5A80; --c-site:#B8561A; --c-deliv:#2F7D4E; --c-insp:#7A4FB0; --c-start:#0F7A83; --c-proj:#1D2226;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --font-head:"Barlow Semi Condensed","Barlow","Arial Narrow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E6E9E7; --muted:#9BA5AC;
    --rule:#343A40; --rule-strong:#59636C;
    --signal:#F4C20D; --signal-ink:#1D2226; --signal-soft:#3A3310;
    --action:#7AAEEB; --action-ink:#0E1A28; --alert:#F0877E; --alert-soft:#3A1D1B;
    --c-coord:#8FA9CF; --c-site:#E08B55; --c-deliv:#6FC08F; --c-insp:#B59AE0; --c-start:#5CC4CC; --c-proj:#E6E9E7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --ink:#E6E9E7; --muted:#9BA5AC;
  --rule:#343A40; --rule-strong:#59636C;
  --signal:#F4C20D; --signal-ink:#1D2226; --signal-soft:#3A3310;
  --action:#7AAEEB; --action-ink:#0E1A28; --alert:#F0877E; --alert-soft:#3A1D1B;
  --c-coord:#8FA9CF; --c-site:#E08B55; --c-deliv:#6FC08F; --c-insp:#B59AE0; --c-start:#5CC4CC; --c-proj:#E6E9E7;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.1;font-weight:600;letter-spacing:.005em}
p{margin:0}
a{color:var(--action)}
:focus-visible{outline:3px solid var(--action);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px 24px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:23px;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:20px;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;font-weight:600;font-size:15.5px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 7px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--signal)}
.top .spacer{flex:1}
@media (max-width:720px){
  .top-inner{padding:8px 14px 0}
  .tabs{order:3;width:100%;margin:0 -6px}
  .top .spacer{display:none}
  .top .btn-new{margin-left:auto}
}

/* Buttons */
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--action);color:var(--action-ink);border-color:var(--action)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--action)}
.btn-signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn-signal:hover{border-color:var(--signal-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--rule)}
.btn-danger{color:var(--alert)}
.btn-sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--action);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:26px}
.page-h h1{font-size:clamp(30px,4.2vw,42px);font-weight:700}
.page-h p{margin-top:6px;color:var(--muted);max-width:64ch}
.grid-2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr);gap:32px}}
.sec{margin-bottom:34px}
.sec-h{font-size:23px;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--font-body);font-size:14px;font-weight:600;background:var(--signal);color:var(--signal-ink);border-radius:999px;padding:1px 9px;line-height:1.5}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;color:var(--muted)}
.note b{color:var(--ink)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--signal-soft);border:1px solid var(--signal);border-radius:4px;padding:12px 16px;margin-bottom:24px}
.warn-box{border:1px solid var(--alert);background:var(--alert-soft);border-radius:4px;padding:14px 16px;margin-bottom:26px}
.warn-box h2{font-size:19px;margin-bottom:8px;color:var(--alert)}
.warn-box ul{margin:0;padding-left:20px}
.warn-box li{margin:4px 0}
.warn-box li small{color:var(--muted);font-size:14px}

/* Reminder cards */
.rem{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--signal);padding:16px 18px 14px;margin-bottom:14px;border-radius:2px 4px 4px 2px}
.rem-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.kind{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--muted)}
.kind::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--cat);flex:none}
.rem h3{font-size:23px;margin:3px 0 3px}
.rem h3 button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.rem h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--muted);font-size:15px}
.when{font-family:var(--font-head);font-weight:700;font-size:22px;white-space:nowrap;text-align:right;line-height:1}
.when small{display:block;font-family:var(--font-body);font-weight:500;font-size:13.5px;color:var(--muted);margin-top:4px}
.rem-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* The countdown ruler */
.ruler{position:relative;height:46px;margin:18px 26px 6px 18px}
.ruler .base{position:absolute;left:0;right:0;top:9px;height:2px;background:var(--rule-strong)}
.ruler .fill{position:absolute;left:0;top:8px;height:4px;background:var(--ink);border-radius:2px}
.tk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tk i{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule-strong);background:var(--surface);display:grid;place-items:center}
.tk i svg{width:11px;height:11px}
.tk.sent i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tk.dismissed i,.tk.passed i{background:var(--rule-strong);border-color:var(--rule-strong)}
.tk.due i{background:var(--signal);border-color:var(--signal-ink);box-shadow:0 0 0 4px var(--signal-soft)}
.tk.due span{color:var(--ink);font-weight:600}
.tk.ev i{border-radius:3px;background:var(--cat);border-color:var(--cat)}
.tk.ev span{color:var(--ink);font-weight:600}
.now{position:absolute;top:-11px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink)}

/* Rows and agenda */
.list{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:11px 2px 11px 0;border-bottom:1px solid var(--rule);align-items:start}
.row-bar{align-self:stretch;background:var(--cat);border-radius:2px;min-height:22px}
.row-title{font-weight:600;font-size:16px}
.row-sub{display:flex;flex-wrap:wrap;gap:1px 14px;color:var(--muted);font-size:14.5px;margin-top:1px}
.row-next{font-size:14px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:3px;background:var(--signal);color:var(--signal-ink)}
.tag.quiet{background:var(--surface-2);color:var(--muted);border:1px solid var(--rule)}
.is-done .row-title{text-decoration:line-through;color:var(--muted)}
.is-past{opacity:.65}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.day-h{display:flex;gap:10px;align-items:baseline;font-family:var(--font-head);font-weight:600;font-size:17px;padding:16px 0 6px}
.day-h:first-child{padding-top:0}
.day-h .rel{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:500}
.agenda .list{border-top:0}
.agenda .row:last-child{border-bottom:0}
.agenda-day{border-bottom:1px solid var(--rule);padding-bottom:4px}

/* Timeline (project page) */
.trow{display:grid;grid-template-columns:74px 4px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.tdate{line-height:1.15}
.tdate b{display:block;font-family:var(--font-head);font-size:19px;font-weight:600;white-space:nowrap}
.tdate span{font-size:13.5px;color:var(--muted)}
@media (max-width:560px){
  .trow{grid-template-columns:62px 4px minmax(0,1fr)}
  .trow .row-actions{grid-column:3;justify-content:flex-start}
  .row{grid-template-columns:4px minmax(0,1fr)}
  .row .row-actions{grid-column:2;justify-content:flex-start}
  .rem-top{flex-direction:column;gap:6px}
  .when{text-align:left}
}

/* Projects list */
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 260px;gap:6px 20px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--rule)}
.prow-open{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.prow-open span{display:block}
.prow-open:hover .prow-name{text-decoration:underline;text-underline-offset:3px}
.prow-dates{cursor:pointer}
.prow-name{font-family:var(--font-head);font-weight:600;font-size:21px}
.prow-sub{color:var(--muted);font-size:14.5px}
.prow-end{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr)}.prow-end{justify-content:flex-start}}

/* People */
.person{padding:13px 0;border-bottom:1px solid var(--rule)}
.person-name{font-weight:600}
.pref{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;border:1px solid var(--rule-strong);border-radius:3px;padding:1px 8px;margin-top:5px}

/* Calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-bar h1{font-size:clamp(28px,4vw,38px);font-weight:700;min-width:8ch}
.cal-nav{display:flex;gap:6px;align-items:center}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--action)}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd div{font-size:13.5px;font-weight:600;color:var(--muted);padding:6px 8px}
.cal-grid{border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cal-cell{min-height:112px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;font:inherit;color:inherit;min-width:0}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2);color:var(--muted)}
.cal-cell.is-sel{box-shadow:inset 0 0 0 2px var(--action)}
.cal-num{font-weight:600;font-size:14.5px;width:26px;height:26px;display:grid;place-items:center;border-radius:3px}
.cal-cell.is-today .cal-num{background:var(--signal);color:var(--signal-ink)}
.chip{display:block;font-size:12.5px;line-height:1.25;padding:2px 5px;border-left:3px solid var(--cat);background:var(--surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 2px 2px 0}
.cal-cell.out .chip{opacity:.7}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.cal-rem{font-size:12px;font-weight:600;margin-top:auto;display:flex;align-items:center;gap:5px;color:var(--ink)}
.cal-rem::before{content:"";width:12px;height:4px;background:var(--signal);border-radius:1px}
.cal-dots{display:none;gap:3px;flex-wrap:wrap}
.cal-dots i{width:7px;height:7px;border-radius:2px;background:var(--cat)}
@media (max-width:680px){
  .cal-cell{min-height:58px;padding:4px}
  .cal-chips,.cal-rem span{display:none}
  .cal-dots{display:flex}
  .cal-rem{font-size:0;margin-top:0}
  .cal-wd div{padding:6px 4px;font-size:12px}
}
.day-panel{margin-top:26px}
.day-panel h2{font-size:24px;margin-bottom:12px}

/* Forms */
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.f{grid-column:span 6;min-width:0}
.f.half{grid-column:span 3}
.f.third{grid-column:span 2}
@media (max-width:620px){.f.half,.f.third{grid-column:span 6}}
label,.lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--surface);color:var(--ink);min-height:44px}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px color-mix(in srgb,var(--action) 25%,transparent)}
input[aria-invalid="true"]{border-color:var(--alert)}
.err{color:var(--alert);font-size:14px;margin-top:5px;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin-top:5px}

/* Wizard */
.wiz{position:fixed;inset:0;z-index:50;background:rgba(18,22,25,.5);display:flex;justify-content:center;align-items:stretch;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.wiz[hidden]{display:none}
.wiz-panel{background:var(--surface);width:min(1060px,100%);display:grid;grid-template-columns:250px minmax(0,1fr);border-radius:6px;overflow:hidden;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.wiz-side{background:var(--surface-2);border-right:1px solid var(--rule);overflow:auto;padding:18px 0}
.wiz-side h2{font-size:17px;padding:0 18px 12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz-side ol{list-style:none;margin:0;padding:0}
.ws{display:flex;align-items:center;gap:10px;width:100%;padding:7px 18px;background:none;border:0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;text-align:left}
.ws b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;border:1.5px solid var(--rule-strong);font-weight:600}
.ws.has b{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ws:hover{color:var(--ink)}
.ws.cur{color:var(--ink);font-weight:600;background:var(--surface)}
.ws.cur b{background:var(--signal);border-color:var(--signal-ink);color:var(--signal-ink)}
.wiz-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.wiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 0 32px}
.wiz-head .prog{font-size:14px;color:var(--muted);font-weight:600}
.ws-select{display:none;max-width:260px;min-height:38px;padding:6px 8px;font-size:15px}
.wiz-scroll{overflow:auto;padding:14px 32px 28px;flex:1}
.q{font-size:clamp(26px,3.4vw,34px);font-weight:600;margin:0 0 8px;max-width:26ch}
.q:focus{outline:none}
.q-help{color:var(--muted);margin:0 0 22px;max-width:62ch}
.wiz-foot{border-top:1px solid var(--rule);padding:12px 32px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface)}
.item{border:1px solid var(--rule);border-radius:4px;padding:14px 16px 16px;margin-bottom:14px;background:var(--surface)}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.item-head h3{font-size:19px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.quick .btn{white-space:normal;text-align:left}
.calc{margin-top:14px;font-weight:600}
.review-list .row{grid-template-columns:4px 110px minmax(0,1fr)}
.review-list .rd{font-weight:600;font-size:15px}
@media (max-width:760px){
  .wiz{padding:0}
  .wiz-panel{grid-template-columns:minmax(0,1fr);border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);width:100%}
  .wiz-side{display:none}
  .ws-select{display:block}
  .wiz-head{padding:10px 14px 0}
  .wiz-head .prog{display:none}
  .wiz-scroll{padding:12px 16px 24px}
  .wiz-foot{padding:10px 16px}
  .review-list .row{grid-template-columns:4px minmax(0,1fr)}
  .review-list .rd{grid-column:2}
}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,22,25,.5);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);border-radius:6px;width:min(640px,100%);max-height:100%;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h2{font-size:26px;margin-bottom:14px}
.modal-box textarea{min-height:260px;font-size:14.5px}
.modal-box .btns{margin-top:16px}

/* Empty state */
.hero{padding:34px 0 10px;max-width:760px}
.hero h1{font-size:clamp(34px,5.6vw,56px);font-weight:700;line-height:1.02;margin-bottom:16px}
.hero p{font-size:18px;color:var(--muted);max-width:58ch;margin-bottom:24px}
.demo{margin-top:40px;max-width:640px}
.demo .lbl{color:var(--muted);font-weight:500;margin-bottom:0}

/* Settings */
.set-sec{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px 40px}
.set-sec:first-of-type{padding-top:0}
.set-sec h2{font-size:21px;margin-bottom:6px}
.set-sec .muted{font-size:15px}
@media (max-width:760px){.set-sec{grid-template-columns:minmax(0,1fr)}}
.offs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--action);flex:none}

const DEFAULT_SETTINGS = {email:'', offsets:[30,14,7,2], remindTime:'08:00', includeStakeholders:true, fdepThreshold:549};
const t0 = todayISO();
const S = {
  projects:{}, settings:clone(DEFAULT_SETTINGS),
  view:'today', projectId:null,
  calMonth:t0.slice(0,7), calSel:t0, calRem:true,
  wiz:null, storage:'loading', evIndex:{}
};
let dbRef = null, profileRef = null, projectsCol = null, unsubs = [];
const mainEl = $('#main'), wizEl = $('#wizard'), modalEl = $('#modal'), toastEl = $('#toast');

/* ---------- Derived schedule ---------- */
function finishDate(p){
  const n = Number(p.durationValue);
  if(!parseISO(p.startDate) || !n || n < 0) return null;
  if(p.durationUnit === 'months'){ const d = parseISO(p.startDate); d.setMonth(d.getMonth()+Math.round(n)); return toISO(d); }
  return addDays(p.startDate, Math.round(n * (p.durationUnit==='weeks' ? 7 : 1)));
}
function contactPhrase(m){
  const map = {'Email':'by email','Phone call':'by phone','Text message':'by text','Microsoft Teams':'on Teams','In person':'in person','Mail / letter':'by mail'};
  return map[m] ? ' ' + map[m] : '';
}
function msTitle(m){
  switch(m.type){
    case 'inspection': { const t = (m.inspType||'').trim(); if(!t) return 'Inspection'; return /(inspection|test)$/i.test(t) ? t : t + ' inspection'; }
    case 'fuel': { const ft = m.fuelType || ''; if(ft === 'Natural gas') return 'Natural gas hookup'; return ft ? ft.replace(/ \(.*\)$/,'') + ' delivery' : 'Fuel delivery'; }
    case 'generator': return 'Generator delivery' + (m.kw ? ` (${m.kw} kW)` : '');
    case 'other': return (m.title||'').trim() || 'Other work';
    default: return (TYPES[m.type]||TYPES.other).label;
  }
}
function projectEvents(p){
  const out = [];
  const mk = e => { e.project = p; e.key = p.id + '|' + e.id; e.inactive = p.status === 'complete'; out.push(e); };
  if(parseISO(p.startDate)) mk({id:'start', type:'start', date:p.startDate, title:'Project start', done:!!p.startDone});
  const fin = finishDate(p);
  if(fin) mk({id:'finish', type:'finish', date:fin, title:'Estimated completion', noRemind:true});
  (p.milestones||[]).forEach(m => {
    if(parseISO(m.date)) mk({id:m.id, type:m.type, date:m.date, time:m.time, title:msTitle(m), src:m, done:!!m.done});
    if(m.type === 'concrete' && parseISO(m.formDate)) mk({id:'form_'+m.id, type:'forming', date:m.formDate, time:m.formTime, title:'Concrete forming', src:m, done:!!m.formDone});
    if(fdepRequired(m)){
      const cap = fmtNum(toNum(m.tank));
      if(parseISO(m.fdepInstallDate)){
        mk({id:'fdepn_'+m.id, type:'fdep', date:addDays(m.fdepInstallDate,-30), title:'FDEP installation notice due', note:`Send 30 to 45 days before the ${cap} gallon tank is installed on ${fmtShort(m.fdepInstallDate)}.`, prep:PREP_FDEP.notice, src:m, done:!!m.fdepNoticeDone});
        mk({id:'fdepc_'+m.id, type:'fdep', date:addDays(m.fdepInstallDate,-3), title:'Confirm tank install with FDEP inspector', note:`Confirm 48 to 72 hours before the tank is installed on ${fmtShort(m.fdepInstallDate)}.`, prep:PREP_FDEP.confirm, src:m, done:!!m.fdepConfirmDone});
        mk({id:'fdept_'+m.id, type:'fdep', date:m.fdepInstallDate, title:'Fuel tank installation', note:`${cap} gallon tank.`, prep:PREP_FDEP.install, src:m, done:!!m.fdepInstallDone});
      }
      if(parseISO(m.fdepInspDate)) mk({id:'fdepi_'+m.id, type:'fdep', date:m.fdepInspDate, time:m.fdepInspTime, title:'FDEP tank inspection', prep:PREP_FDEP.inspect, src:m, done:!!m.fdepInspDone});
    }
  });
  (p.stakeholders||[]).forEach(s => { if(parseISO(s.contactBy)) mk({id:'sh_'+s.id, type:'stakeholder', date:s.contactBy, title:`Contact ${(s.name||'').trim() || 'stakeholder'}${contactPhrase(s.preferred)}`, src:s, done:!!s.contacted}); });
  return out;
}
const byDate = (a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time||'99') < (b.time||'99') ? -1 : 1);
function allEvents(){ return Object.values(S.projects).flatMap(projectEvents); }
function activeProjects(){ return Object.values(S.projects).filter(p => p.status !== 'complete'); }
function offsets(){ return [...new Set((S.settings.offsets||[]).map(Number).filter(n => n > 0 && n < 400))].sort((a,b) => b-a); }

function remState(ev){
  const t = todayISO();
  const d = diffDays(t, ev.date);
  const log = ev.project.reminderLog || {};
  const off = offsets();
  const noRemind = !!(ev.noRemind || ev.done || ev.inactive);
  const ticks = off.map(o => {
    const rd = addDays(ev.date, -o), h = log[ev.id+'|'+o];
    let st = 'upcoming';
    if(h) st = h.s === 'dismissed' ? 'dismissed' : 'sent';
    else if(d < 0 || o >= d) st = 'passed';
    return {o, rd, st};
  });
  let due = null;
  if(!noRemind && d >= 0){
    const reached = ticks.filter(x => x.o >= d);
    const latest = reached[reached.length-1];
    if(latest && !log[ev.id+'|'+latest.o]) due = latest;
  }
  const next = (!noRemind && d >= 0) ? (ticks.filter(x => x.o < d)[0] || null) : null;
  return {d, ticks, due, next, noRemind};
}
function dueList(){ return allEvents().map(ev => ({ev, rs:remState(ev)})).filter(x => x.rs.due).sort((a,b) => byDate(a.ev,b.ev)); }

function projectWarnings(p){
  const w = [], t = todayISO();
  const ms = (p.milestones||[]).filter(m => parseISO(m.date));
  const pours = ms.filter(m => m.type === 'concrete');
  ms.filter(m => m.type==='generator' || m.type==='crane').forEach(m => {
    pours.forEach(pr => {
      const gap = diffDays(pr.date, m.date);
      if(gap >= 0 && gap < 7) w.push({ids:[m.id], text:`${msTitle(m)} (${fmtShort(m.date)}) is ${gap===0 ? 'the same day as' : plural(gap,'day')+' after'} the concrete pour. Pads usually need about 7 days to cure before equipment is set. Check with your engineer.`});
    });
  });
  (p.milestones||[]).filter(m => m.type === 'concrete' && parseISO(m.formDate) && parseISO(m.date) && m.formDate >= m.date).forEach(m => {
    w.push({ids:[m.id], text:`Forming (${fmtShort(m.formDate)}) isn’t scheduled before the pour (${fmtShort(m.date)}).`});
  });
  if(p.plans && p.plans.data){
    const cids = (p.milestones||[]).filter(m => m.type === 'concrete').map(m => m.id);
    padChecks(p.plans.data).filter(c => c.ok === false).forEach(c => w.push({ids:cids, text:c.text}));
    const nc = (p.plans.data.conflicts || []).length;
    if(nc) w.push({ids:[], text:`The plan review found ${plural(nc,'discrepancy','discrepancies')} between the documents. See the Plans section on the project page.`});
  }
  (p.milestones||[]).filter(fdepRequired).forEach(m => {
    const cap = fmtNum(toNum(m.tank));
    if(!parseISO(m.fdepInstallDate)) w.push({ids:[m.id], text:`The ${cap} gallon fuel tank needs FDEP notices and an inspection. Add the tank installation date on the Fuel step to get those reminders.`});
    else { const due = addDays(m.fdepInstallDate, -30); if(!m.fdepNoticeDone && due < t && m.fdepInstallDate >= t) w.push({ids:[m.id], text:`The FDEP installation notice for the ${cap} gallon tank was due ${fmtShort(due)}, 30 days before installation.`}); }
  });
  const fuels = ms.filter(m => m.type === 'fuel').sort(byDate);
  ms.filter(m => m.type === 'startup').forEach(su => {
    if(!fuels.length) w.push({ids:[su.id], text:`Startup is set for ${fmtShort(su.date)}, but no fuel delivery or hookup is scheduled.`});
    else if(fuels[0].date > su.date) w.push({ids:[su.id], text:`Startup (${fmtShort(su.date)}) comes before the first fuel date (${fmtShort(fuels[0].date)}).`});
  });
  if(parseISO(p.startDate)){
    const d = diffDays(t, p.startDate);
    const open = (p.milestones||[]).filter(m => m.type==='plans' && m.status && m.status !== 'Approved');
    if(d >= 0 && d <= 14 && open.length) w.push({ids:open.map(m=>m.id), text:`Work starts ${whenPhrase(d)} and the plans aren’t marked approved yet.`});
    const fin = finishDate(p);
    ms.forEach(m => {
      if(['turnover','plans'].includes(m.type)) return;
      if(m.date < p.startDate) w.push({ids:[m.id], text:`${msTitle(m)} (${fmtShort(m.date)}) is before the project start date.`});
      else if(fin && m.date > fin) w.push({ids:[m.id], text:`${msTitle(m)} (${fmtShort(m.date)}) is after the estimated completion date.`});
    });
    (p.milestones||[]).filter(m => m.type === 'concrete' && parseISO(m.formDate) && m.formDate < p.startDate).forEach(m => {
      w.push({ids:[m.id], text:`Concrete forming (${fmtShort(m.formDate)}) is before the project start date.`});
    });
  }
  return w;
}

function summaryParts(ev){
  const step = STEP_BY_TYPE[ev.type], src = ev.src;
  if(!step || !src) return [];
  const skip = ['date','time','notes','title','inspType','name','contactBy','email','phone'];
  const parts = [];
  if(ev.type === 'stakeholder'){
    if(src.role || src.company) parts.push([src.role, src.company].filter(Boolean).join(', '));
    const c = preferredContact(src); if(c) parts.push(c);
    return parts;
  }
  if(ev.type === 'forming'){
    if(src.formCrew) parts.push(src.formCrew);
    if(src.padSize) parts.push(src.padSize);
    parts.push(parseISO(src.date) ? `Pour ${fmtShort(src.date)}` : 'Pour date not set');
    return parts;
  }
  if(ev.type === 'fdep'){
    if(toNum(src.tank)) parts.push(`${fmtNum(toNum(src.tank))} gal tank`);
    if(src.fdepContact) parts.push(src.fdepContact);
    if(src.fdepStatus) parts.push(src.fdepStatus);
    return parts;
  }
  if(ev.type === 'crane'){
    if(src.tons) parts.push(`${src.tons}-ton crane`);
    if(src.company) parts.push(src.company);
    const pc = packageCalc(src);
    if(pc.lift) parts.push(`Lift weight ${fmtNum(pc.lift)} lbs`);
    return parts;
  }
  if(ev.type === 'fuel' && fdepRequired(src)) parts.push('FDEP inspections required');
  if(ev.type === 'concrete') skip.push('formDate','formTime','formCrew');
  step.fields.forEach(f => {
    if(skip.includes(f.k) || parts.length >= 3) return;
    const v = src[f.k]; if(v == null || String(v).trim() === '') return;
    if(f.k === 'kw') return;
    if(f.k === 'status' || f.k === 'fuelType') parts.push(String(v));
    else if(f.k === 'yards') parts.push(`${v} yd³`);
    else if(f.k === 'quantity') parts.push(`${v} gal`);
    else if(f.k === 'tank') parts.push(`${v} gal tank`);
    else if(f.k === 'qty') parts.push(`Qty ${v}`);
    else if(f.k === 'tons') parts.push(`${v}-ton crane`);
    else if(f.t === 'date') parts.push(`${f.label}: ${fmtShort(v)}`);
    else if(f.t === 'yesno') parts.push(`${f.label.replace(/\?$/,'')}: ${v}`);
    else parts.push(String(v));
  });
  return parts;
}
function preferredContact(s){
  if(s.preferred === 'Email') return s.email || '';
  if(s.preferred === 'Phone call' || s.preferred === 'Text message') return s.phone || '';
  return s.phone || s.email || '';
}
function stakeLine(s){
  const who = [s.name, s.role].filter(Boolean).join(', ') + (s.company ? ` (${s.company})` : '');
  const bits = [];
  if(s.preferred) bits.push('prefers ' + s.preferred.toLowerCase().replace('microsoft teams','Microsoft Teams'));
  const c = preferredContact(s); if(c) bits.push(c);
  if(s.bestTime) bits.push('best time: ' + s.bestTime);
  return who + (bits.length ? ', ' + bits.join(', ') : '');
}

/* ---------- Email text ---------- */
function detailLines(ev){
  const p = ev.project, L = [];
  L.push(`Project: ${p.name}${p.projectNumber ? ` (#${p.projectNumber})` : ''}`);
  if(p.client) L.push(`Client: ${p.client}`);
  if(p.siteAddress) L.push(`Site: ${p.siteAddress}`);
  L.push(`Date: ${fmtLong(ev.date)}${ev.time ? ' at ' + fmtTime(ev.time) : ''}`);
  if(ev.note) L.push(ev.note);
  if(ev.type === 'crane' && ev.src){
    const pc = packageCalc(ev.src);
    if(pc.base) L.push(`Total package weight from the submittal: ${fmtNum(pc.base)} lbs${pc.basis ? ` (${pc.basis})` : ''}`, `Lift weight (total package weight × 1.1): ${fmtNum(pc.lift)} lbs`);
  }
  const step = STEP_BY_TYPE[ev.type], src = ev.src;
  if(src && (ev.type === 'fuel' || ev.type === 'fdep') && fdepRequired(src)) L.push(`FDEP storage tank inspections: required (${fmtNum(toNum(src.tank))} gallons; flagged at ${fmtNum(fdepThreshold())} gallons and up)`);
  if(step && src){
    const skipKeys = ev.type === 'forming' ? ['formDate','formTime','title'] : ev.type === 'fdep' ? ['title'] : ['date','time','contactBy','title'];
    const fields = step.fields.concat((ev.type === 'fuel' || ev.type === 'fdep') && fdepRequired(src) ? FDEP_FIELDS : []);
    const det = fields.filter(f => !skipKeys.includes(f.k) && src[f.k] != null && String(src[f.k]).trim() !== '')
      .map(f => `  ${f.label}: ${f.t==='date' ? fmtShort(src[f.k]) : f.t==='time' ? fmtTime(src[f.k]) : src[f.k]}`);
    if(det.length){ L.push('', 'Details'); L.push(...det); }
  }
  const prep = ev.prep || PREP[ev.type];
  if(prep && prep.length){ L.push('', 'Before this date'); prep.forEach(x => L.push('  [ ] ' + x)); }
  const warns = src ? projectWarnings(p).filter(w => w.ids.includes(src.id)) : [];
  if(warns.length){ L.push('', 'Schedule check'); warns.forEach(w => L.push('  ! ' + w.text)); }
  if(S.settings.includeStakeholders && ev.type !== 'stakeholder'){
    const sh = (p.stakeholders||[]).filter(s => (s.name||'').trim());
    if(sh.length){ L.push('', 'Stakeholders to keep informed'); sh.forEach(s => L.push('  - ' + stakeLine(s))); }
  }
  return L;
}
function emailFor(ev, rs){
  const p = ev.project;
  const subject = `${ev.title} ${whenPhrase(rs.d)}: ${p.name} (${fmtShort(ev.date)})`;
  const L = [`Reminder: ${ev.title} is ${whenPhrase(rs.d)}.`, '', ...detailLines(ev), '', `Sent from Lead Time${rs.due ? `, ${offLong(rs.due.o)} reminder` : ''}.`];
  return {subject, body:L.join('\n')};
}
function digestEmail(){
  const t = todayISO(), due = dueList();
  const soon = allEvents().filter(ev => !ev.inactive && !ev.done && ev.date >= t && diffDays(t, ev.date) <= 7).sort(byDate);
  const L = [`Project reminders for ${fmtLong(t)}`, ''];
  if(due.length){
    L.push(`Reminders to act on (${due.length})`);
    due.forEach(({ev, rs}) => {
      L.push('', `- ${ev.title}, ${whenPhrase(rs.d)} (${fmtShort(ev.date)}${ev.time ? ' at ' + fmtTime(ev.time) : ''})`, `  ${ev.project.name}${ev.project.siteAddress ? ', ' + ev.project.siteAddress : ''}`);
      summaryParts(ev).forEach(x => L.push('  ' + x));
    });
  } else L.push('No reminders are due today.');
  L.push('', 'Happening in the next 7 days');
  if(soon.length) soon.forEach(ev => L.push(`  ${fmtShort(ev.date)}${ev.time ? ' ' + fmtTime(ev.time) : ''}: ${ev.title} (${ev.project.name})`));
  else L.push('  Nothing scheduled.');
  L.push('', 'Sent from Lead Time.');
  return {subject:`Project reminders for ${fmtShort(t)}: ${due.length ? plural(due.length,'item') + ' to act on' : 'all caught up'}`, body:L.join('\n')};
}
function mailto(em){
  const to = (S.settings.email||'').replace(/[\s,;]+/g,'');
  return `mailto:${to}?subject=${encodeURIComponent(em.subject)}&body=${encodeURIComponent(em.body.replace(/\n/g,'\r\n'))}`;
}

/* ---------- Storage ---------- */
const LS_KEY = 'leadtime.v1';
function lsRead(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({projects:S.projects, settings:S.settings, mode:S.storage})); }catch(e){} }
const queues = {};
function enqueue(key, fn){
  const run = () => fn().catch(e => (e && e.code === 'unavailable') ? new Promise(r => setTimeout(r, 400 + Math.random()*600)).then(fn) : Promise.reject(e));
  const next = (queues[key] || Promise.resolve()).then(run).catch(onWriteError);
  queues[key] = next; return next;
}
function onWriteError(e){
  const code = e && e.code;
  if(code === 'quota_exceeded') toast('Storage is full. Delete an old project to keep saving to your account.');
  else if(code === 'invalid_argument' || code === 'revoked' || code === 'not_granted'){
    goLocal();
    toast('Couldn’t save to your account, so changes are being kept in this browser for now.');
  } else toast('A change didn’t save. Try again in a moment.');
}
function goLocal(){ unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = []; projectsCol = null; profileRef = null; S.storage = 'local'; lsWrite(); }
function sameProject(a, b){ const x = clone(a), y = clone(b); delete x.updatedAt; delete y.updatedAt; return JSON.stringify(x) === JSON.stringify(y); }
function writeProject(p, opts){
  opts = opts || {};
  p.updatedAt = Date.now();
  S.projects[p.id] = p; lsWrite();
  if(opts.delay) setTimeout(render, opts.delay); else render();
  if(projectsCol){ const body = clone(p); enqueue('p:'+p.id, () => projectsCol.doc(p.id).set(body)); }
}
function removeProject(id){
  delete S.projects[id]; lsWrite(); render();
  if(projectsCol) enqueue('p:'+id, () => projectsCol.doc(id).delete());
}
function writeSettings(){
  lsWrite(); render();
  if(profileRef){ const body = clone(S.settings); enqueue('settings', () => profileRef.set(body)); }
}
async function useCap(name){
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  if(!inClaude) return name === 'sample' && getApiKey() ? apiSample : null;
  try{ return await window.claude.use(name); }catch(e){ return null; }
}

/* ---------- Plan review on your own website (outside Claude) ----------
   Uses your Anthropic API key, saved only in this browser's storage. Never put the key in the code. */
const API_KEY_LS = 'leadtime.apiKey';
const API_MODEL = 'claude-sonnet-5-5';
function getApiKey(){ try{ return localStorage.getItem(API_KEY_LS) || ''; }catch(e){ return ''; } }
function setApiKey(v){ try{ if(v) localStorage.setItem(API_KEY_LS, v); else localStorage.removeItem(API_KEY_LS); return true; }catch(e){ return false; } }
function blobToBase64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
function apiError(code, message){ const e = new Error(message || code); e.code = code; return e; }
const apiSample = {
  async limits(){ return {images:{maxCount:10, maxInputBytes:3500000, mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}}; },
  async json(prompt, opts){
    opts = opts || {};
    const key = getApiKey(); if(!key) throw apiError('api_key');
    const content = [];
    for(const img of (opts.images || [])){
      const type = /^image\/(jpeg|png|webp|gif)$/.test(img.type || '') ? img.type : 'image/jpeg';
      content.push({type:'image', source:{type:'base64', media_type:type, data:await blobToBase64(img)}});
    }
    content.push({type:'text', text:prompt});
    let res;
    try{
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', signal:opts.signal,
        headers:{'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:API_MODEL, max_tokens:8000, system:'Reply with only a single JSON object: no other text and no code fences.', messages:[{role:'user', content}]})
      });
    }catch(e){ throw apiError(e && e.name === 'AbortError' ? 'cancelled' : 'network'); }
    if(!res.ok){
      let msg = ''; try{ const j = await res.json(); msg = (j && j.error && j.error.message) || ''; }catch(e){}
      throw apiError(res.status === 401 || res.status === 403 ? 'api_key' : (res.status === 429 || res.status === 529) ? 'rate_limited' : res.status === 413 ? 'prompt_too_large' : 'api_error', msg);
    }
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    if(a < 0 || b <= a) throw apiError('invalid_json');
    try{ return JSON.parse(text.slice(a, b + 1)); }catch(e){ throw apiError('invalid_json'); }
  }
};
async function shrinkImage(blob, maxBytes){
  if(!blob || blob.size <= maxBytes) return blob;
  try{
    const bmp = await createImageBitmap(blob), sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  }catch(e){ return blob; }
}
async function initStorage(){
  const cached = lsRead();
  const cacheWasLocal = !cached || cached.mode !== 'db';
  if(cached){ S.projects = cached.projects || {}; S.settings = Object.assign(clone(DEFAULT_SETTINGS), cached.settings||{}); }
  render();
  const [db, user] = await Promise.all([useCap('db'), useCap('user')]);
  let id = null;
  if(user){ try{ id = await user.id(); }catch(e){ id = null; } }
  if(!db || !id){ S.storage = 'local'; lsWrite(); render(); return; }
  dbRef = db;
  try{
    profileRef = db.doc(`data/users/${id}/profile`);
    projectsCol = profileRef.collection('projects');
    const [snap, prof] = await Promise.all([projectsCol.get(), profileRef.get()]);
    if(snap.empty && cacheWasLocal && Object.keys(S.projects).length){
      for(const p of Object.values(S.projects)) await projectsCol.doc(p.id).set(clone(p));
    }
    if(!prof.exists && cacheWasLocal && cached && cached.settings) await profileRef.set(clone(S.settings));
  }catch(e){ goLocal(); render(); return; }
  S.storage = 'db'; lsWrite(); render();
  unsubs.push(projectsCol.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if(d.exists){ const v = clone(d.data()); v.id = d.id; next[d.id] = v; } });
    S.projects = next; lsWrite(); renderSoft();
  }, () => { goLocal(); renderSoft(); }));
  unsubs.push(profileRef.onSnapshot(s => {
    if(s.exists){ S.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(s.data())); lsWrite(); renderSoft(); }
  }, () => {}));
}

/* ---------- Rendering ---------- */
let pendingRender = false;
function typingInMain(){ const a = document.activeElement; return a && mainEl.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function renderSoft(){ if(typingInMain()){ pendingRender = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if(pendingRender && !typingInMain()){ pendingRender = false; render(); } }, 0));

function render(){
  S.evIndex = {};
  allEvents().forEach(e => { S.evIndex[e.key] = e; });
  if(S.view === 'project' && !S.projects[S.projectId]) S.view = 'projects';
  document.querySelectorAll('.tab').forEach(b => {
    const on = b.dataset.view === S.view || (S.view === 'project' && b.dataset.view === 'projects');
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const views = {today:renderToday, calendar:renderCalendar, projects:renderProjects, project:renderProject, settings:renderSettings};
  mainEl.innerHTML = (views[S.view] || renderToday)();
}
function go(view){ S.view = view; render(); window.scrollTo(0,0); }

function rulerHTML(ev, rs){
  const off = offsets(); if(!off.length) return '';
  const max = Math.max(30, off[0]);
  const pos = o => ((1 - Math.sqrt(Math.max(0, Math.min(o, max))/max)) * 100).toFixed(2);
  const nowPos = rs.d >= 0 ? pos(rs.d) : 100;
  let h = `<div class="ruler" style="--cat:${catColor(ev.type)}" aria-hidden="true"><div class="base"></div><div class="fill" style="width:${nowPos}%"></div>`;
  rs.ticks.forEach(x => {
    const st = (rs.due && rs.due.o === x.o) ? 'due' : x.st;
    h += `<div class="tk ${st}" style="left:${pos(x.o)}%" title="${esc(offLong(x.o))} before, ${esc(fmtShort(x.rd))}"><i>${st==='sent' ? CHECK : ''}</i><span>${offShort(x.o)}</span></div>`;
  });
  h += `<div class="tk ev" style="left:100%"><i></i><span>Day of</span></div>`;
  if(rs.d >= 0) h += `<div class="now" style="left:${nowPos}%"></div>`;
  h += `</div>`;
  const sent = rs.ticks.filter(x => x.st === 'sent').map(x => offLong(x.o));
  h += `<p class="sr-only">Reminders: ${sent.length ? 'sent ' + sent.join(', ') + '. ' : ''}${rs.next ? 'Next on ' + fmtShort(rs.next.rd) + '.' : 'No more scheduled.'}</p>`;
  return h;
}
function editTarget(ev){
  if(ev.type === 'start' || ev.type === 'finish') return {step:'schedule', item:''};
  if(ev.type === 'stakeholder') return {step:'stakeholders', item:ev.src.id};
  const s = STEP_BY_TYPE[ev.type];
  return {step: s ? s.key : 'job', item: ev.src ? ev.src.id : ''};
}
function editBtn(ev, label){
  const t = editTarget(ev);
  return `<button class="btn btn-sm" data-act="edit-step" data-pid="${esc(ev.project.id)}" data-step="${t.step}" data-item="${esc(t.item)}" aria-label="${esc((label||'Edit') + ' ' + ev.title)}">${esc(label||'Edit')}</button>`;
}
function remCard(ev, rs){
  const em = emailFor(ev, rs), p = ev.project;
  const kind = ev.type === 'fuel' ? 'Fuel' : (TYPES[ev.type]||TYPES.other).label;
  const t = editTarget(ev);
  return `<article class="rem" style="--cat:${catColor(ev.type)}">
    <div class="rem-top">
      <div>
        <span class="kind">${esc(kind)}</span>
        <h3><button data-act="edit-step" data-pid="${esc(p.id)}" data-step="${t.step}" data-item="${esc(t.item)}">${esc(ev.title)}</button></h3>
        <div class="meta"><span>${esc(p.name)}</span><span class="tnum">${esc(fmtShort(ev.date))}${ev.time ? ', ' + esc(fmtTime(ev.time)) : ''}</span>${summaryParts(ev).slice(0,2).map(x => `<span>${esc(x)}</span>`).join('')}</div>
      </div>
      <div class="when tnum">${esc(relDay(rs.d))}<small>${esc(offLong(rs.due.o))} reminder</small></div>
    </div>
    ${rulerHTML(ev, rs)}
    <div class="rem-actions">
      <a class="btn btn-signal" href="${esc(mailto(em))}" target="_blank" rel="noopener" data-act="rem-email" data-key="${esc(ev.key)}" data-off="${rs.due.o}">Email me</a>
      <button class="btn" data-act="rem-preview" data-key="${esc(ev.key)}">Preview email</button>
      <button class="btn btn-ghost" data-act="rem-dismiss" data-key="${esc(ev.key)}" data-off="${rs.due.o}">Dismiss</button>
    </div>
  </article>`;
}
function evRow(ev, opts){
  opts = opts || {};
  const parts = [];
  if(opts.showJob) parts.push(ev.project.name);
  if(ev.time) parts.push(fmtTime(ev.time));
  parts.push(...summaryParts(ev).slice(0, opts.showJob ? 1 : 2));
  return `<div class="row ${ev.done ? 'is-done' : ''}" style="--cat:${catColor(ev.type)}">
    <div class="row-bar"></div>
    <div><div class="row-title">${esc(ev.title)}</div><div class="row-sub">${parts.map(x => `<span>${esc(x)}</span>`).join('')}</div></div>
    <div class="row-actions">${ev.type === 'finish' ? '' : editBtn(ev,'Open')}</div>
  </div>`;
}
function warnBox(list, withJob){
  if(!list.length) return '';
  return `<section class="warn-box" aria-label="Schedule checks"><h2>Schedule ${list.length === 1 ? 'check' : 'checks'}</h2><ul>${list.map(w => `<li>${esc(w.text)}${withJob ? ` <small>${esc(w.p.name)}</small>` : ''}</li>`).join('')}</ul></section>`;
}

function renderEmpty(){
  const demoEv = {id:'demo', type:'crane', date:addDays(todayISO(), 10), project:{reminderLog:{'demo|30':{s:'sent'}}}};
  const rs = remState(demoEv); rs.due = rs.ticks.find(x => x.o === 14) || null;
  return `<section class="hero">
    <h1>Every date on the job, with reminders before each one.</h1>
    <p>Answer a few questions about a project: the turnover meeting, plans review, stakeholders, concrete forming and pour, fuel, generator and ATS deliveries, the crane, inspections, and startup. Lead Time reminds you ${esc(offsets().map(offLong).join(', ').replace(/, ([^,]*)$/, ' and $1'))} before each one, with the details ready to email to yourself.</p>
    <div class="btns"><button class="btn btn-primary" data-act="new-project">Set up a project</button><button class="btn" data-act="example">Try an example project</button></div>
    <div class="demo">
      <p class="lbl">How a reminder track reads: the 1-month reminder went out, the 2-week one is ready, and the crane lift is 10 days away.</p>
      ${rulerHTML(demoEv, rs)}
    </div>
  </section>`;
}

function renderToday(){
  if(!Object.keys(S.projects).length) return renderEmpty();
  const t = todayISO();
  const due = dueList();
  const soon = allEvents().filter(ev => !ev.inactive && ev.date >= t && diffDays(t, ev.date) <= 21).sort(byDate);
  const warns = activeProjects().flatMap(p => projectWarnings(p).map(w => Object.assign({p}, w)));
  const nextRem = allEvents().map(ev => ({ev, rs:remState(ev)})).filter(x => x.rs.next).sort((a,b) => a.rs.next.rd < b.rs.next.rd ? -1 : 1)[0];
  const dateTitle = new Date().toLocaleDateString(LOC, {weekday:'long', month:'long', day:'numeric'});
  const remPart = due.length ? `${plural(due.length,'reminder is','reminders are')} ready to send` : 'You’re caught up on reminders';
  const soonPart = soon.length ? `${plural(soon.length,'date is','dates are')} coming up in the next three weeks` : 'nothing is scheduled for the next three weeks';
  const summary = `${remPart}, and ${soonPart}.`;
  const dg = digestEmail();
  let h = `<div class="page-h"><div><h1>${esc(dateTitle)}</h1><p>${esc(summary)}</p></div>
    <div class="btns"><a class="btn" href="${esc(mailto(dg))}" target="_blank" rel="noopener">Email me today’s summary</a><button class="btn btn-ghost" data-act="digest-preview">Preview summary</button></div></div>`;
  if(!S.settings.email) h += `<div class="banner"><span>Add your email address so reminder emails come addressed to you.</span><button class="btn btn-sm" data-act="tab" data-view="settings">Add email</button></div>`;
  h += warnBox(warns, true);
  h += `<div class="grid-2"><section class="sec" aria-labelledby="h-rem"><h2 class="sec-h" id="h-rem">Reminders to send ${due.length ? `<span class="count">${due.length}</span>` : ''}</h2>`;
  if(due.length) h += due.map(x => remCard(x.ev, x.rs)).join('');
  else h += `<p class="note">${nextRem ? `Nothing to send today. The next reminder is <b>${esc(fmtShort(nextRem.rs.next.rd))}</b> for ${esc(nextRem.ev.title.toLowerCase().startsWith('contact') ? nextRem.ev.title : nextRem.ev.title.toLowerCase())} on ${esc(nextRem.ev.project.name)}.` : 'Nothing to send today. Add dates to your projects and reminders will show up here.'}</p>`;
  h += `</section><section class="sec agenda" aria-labelledby="h-soon"><h2 class="sec-h" id="h-soon">Coming up</h2>`;
  if(soon.length){
    const groups = {};
    soon.forEach(ev => { (groups[ev.date] = groups[ev.date] || []).push(ev); });
    h += Object.keys(groups).map(d => `<div class="agenda-day"><div class="day-h"><span>${esc(fmtShort(d))}</span><span class="rel">${esc(relDay(diffDays(t,d)))}</span></div><div class="list">${groups[d].map(ev => evRow(ev,{showJob:true})).join('')}</div></div>`).join('');
  } else h += `<p class="note">Nothing in the next three weeks.</p>`;
  h += `</section></div>`;
  return h;
}

function renderCalendar(){
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const rows = Math.ceil((lead + daysIn)/7);
  const start = toISO(new Date(y, m-1, 1 - lead));
  const t = todayISO();
  const evs = allEvents(), byDay = {}, remByDay = {};
  evs.forEach(ev => { (byDay[ev.date] = byDay[ev.date] || []).push(ev); });
  Object.values(byDay).forEach(l => l.sort(byDate));
  evs.forEach(ev => {
    const rs = remState(ev); if(rs.noRemind) return;
    rs.ticks.forEach(x => { const isDue = !!(rs.due && rs.due.o === x.o); if(x.st === 'upcoming' || isDue){ const k = isDue ? t : x.rd; (remByDay[k] = remByDay[k] || []).push({ev, o:x.o, label: isDue ? whenPhrase(rs.d) : 'in ' + offLong(x.o)}); } });
  });
  let h = `<div class="cal-bar"><h1>${esc(first.toLocaleDateString(LOC,{month:'long', year:'numeric'}))}</h1>
    <div class="cal-nav">
      <label class="check"><input type="checkbox" data-change="cal-rem" ${S.calRem ? 'checked' : ''}> Show reminder dates</label>
      <button class="btn btn-sm" data-act="cal-move" data-n="-1" aria-label="Previous month">Previous</button>
      <button class="btn btn-sm" data-act="cal-today">Today</button>
      <button class="btn btn-sm" data-act="cal-move" data-n="1" aria-label="Next month">Next</button>
    </div></div>`;
  h += `<div class="cal-wd" aria-hidden="true">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div>${d}</div>`).join('')}</div><div class="cal-grid">`;
  for(let i = 0; i < rows*7; i++){
    const iso = addDays(start, i), dd = parseISO(iso);
    const list = byDay[iso] || [], rems = S.calRem ? (remByDay[iso] || []) : [];
    const cls = [dd.getMonth() !== m-1 ? 'out' : '', iso === t ? 'is-today' : '', iso === S.calSel ? 'is-sel' : ''].join(' ');
    const label = `${fmtLong(iso)}, ${list.length ? plural(list.length,'item') : 'nothing scheduled'}${rems.length ? ', ' + plural(rems.length,'reminder') : ''}`;
    h += `<button class="cal-cell ${cls}" data-act="cal-day" data-date="${iso}" aria-label="${esc(label)}" ${iso === S.calSel ? 'aria-pressed="true"' : ''}>
      <span class="cal-num tnum">${dd.getDate()}</span>
      <span class="cal-chips">${list.slice(0,3).map(ev => `<span class="chip ${ev.done ? 'done' : ''}" style="--cat:${catColor(ev.type)}" title="${esc(ev.title + ', ' + ev.project.name)}">${esc(ev.title)}</span>`).join('')}${list.length > 3 ? `<span class="more">${list.length-3} more</span>` : ''}</span>
      <span class="cal-dots">${list.slice(0,5).map(ev => `<i style="--cat:${catColor(ev.type)}"></i>`).join('')}</span>
      ${rems.length ? `<span class="cal-rem"><span>${plural(rems.length,'reminder')}</span></span>` : ''}
    </button>`;
  }
  h += `</div>`;
  const sel = (byDay[S.calSel] || []), selRem = remByDay[S.calSel] || [];
  h += `<section class="day-panel" aria-live="polite"><h2>${esc(fmtLong(S.calSel))}</h2>`;
  if(!sel.length && !selRem.length) h += `<p class="note">Nothing on this day.</p>`;
  if(sel.length) h += `<div class="list">${sel.map(ev => evRow(ev,{showJob:true})).join('')}</div>`;
  if(selRem.length) h += `<h3 class="sec-h" style="font-size:19px;margin-top:22px">Reminders on this day</h3><div class="list">${selRem.map(r => `<div class="row" style="--cat:var(--signal)"><div class="row-bar"></div><div><div class="row-title">${esc(r.ev.title)} ${esc(r.label)}</div><div class="row-sub"><span>${esc(r.ev.project.name)}</span><span>${esc(fmtShort(r.ev.date))}</span></div></div><div class="row-actions">${editBtn(r.ev,'Open')}</div></div>`).join('')}</div>`;
  h += `</section>`;
  return h;
}

function renderProjects(){
  const list = Object.values(S.projects);
  if(!list.length) return renderEmpty();
  const t = todayISO();
  const row = p => {
    const evs = projectEvents(p).sort(byDate);
    const next = evs.find(ev => ev.date >= t && !ev.done);
    const dueN = evs.filter(ev => remState(ev).due).length;
    const fin = finishDate(p);
    const dates = p.startDate ? `${fmtMD(p.startDate)}${fin ? ' to ' + fmtMD(fin) : ''}` : 'No start date yet';
    return `<div class="prow">
      <button class="prow-open" data-act="open-project" data-id="${esc(p.id)}"><span class="prow-name">${esc(p.name || 'Untitled project')}</span><span class="prow-sub">${esc([p.client, p.siteAddress].filter(Boolean).join(', ') || 'No client or site yet')}</span></button>
      <div class="prow-sub prow-dates" data-act="open-project" data-id="${esc(p.id)}"><div class="tnum">${esc(dates)}</div>${next && p.status !== 'complete' ? `<div>Next: ${esc(next.title)}, ${esc(fmtShort(next.date))}</div>` : ''}</div>
      <div class="prow-end">${p.status === 'complete' ? '<span class="tag quiet">Complete</span>' : dueN ? `<span class="tag">${plural(dueN,'reminder')} to send</span>` : ''}<button class="btn btn-sm btn-ghost btn-danger" data-act="delete-project" data-id="${esc(p.id)}" aria-label="Delete ${esc(p.name || 'project')}">Delete</button></div>
    </div>`;
  };
  const active = list.filter(p => p.status !== 'complete').sort((a,b) => (a.startDate||'9') < (b.startDate||'9') ? -1 : 1);
  const done = list.filter(p => p.status === 'complete');
  let h = `<div class="page-h"><div><h1>Projects</h1><p>${plural(active.length,'active project')}${done.length ? `, ${done.length} complete` : ''}.</p></div><button class="btn btn-primary" data-act="new-project">New project</button></div>`;
  h += `<div class="list">${active.map(row).join('') || '<p class="note" style="margin-top:14px">No active projects.</p>'}</div>`;
  if(done.length) h += `<h2 class="sec-h" style="margin-top:34px">Completed</h2><div class="list">${done.map(row).join('')}</div>`;
  return h;
}

function renderProject(){
  const p = S.projects[S.projectId];
  const t = todayISO();
  const evs = projectEvents(p).sort(byDate);
  const undated = (p.milestones||[]).filter(m => !parseISO(m.date));
  const fin = finishDate(p);
  const meta = [p.client, p.projectNumber ? '#' + p.projectNumber : '', p.siteAddress].filter(Boolean);
  let h = `<p style="margin-bottom:10px"><button class="linkbtn" data-act="tab" data-view="projects">All projects</button></p>
    <div class="page-h"><div><h1>${esc(p.name)}</h1>${meta.length ? `<p>${esc(meta.join(', '))}</p>` : ''}
    <p class="tnum">${p.startDate ? `Starts ${esc(fmtLong(p.startDate))}${fin ? `, estimated completion ${esc(fmtShort(fin))}` : ''}` : 'No start date yet.'}</p>
    ${p.example ? '<p><span class="tag quiet">Example project. Delete it any time.</span></p>' : ''}</div>
    <div class="btns"><button class="btn btn-primary" data-act="edit-step" data-pid="${esc(p.id)}" data-step="job" data-item="">Edit answers</button><button class="btn btn-danger" data-act="delete-project" data-id="${esc(p.id)}">Delete project</button></div></div>`;
  h += warnBox(projectWarnings(p).map(w => Object.assign({p}, w)), false);
  h += `<div class="grid-2"><section class="sec"><h2 class="sec-h">Schedule</h2><div class="list">`;
  if(!evs.length) h += `<p class="note" style="margin-top:14px">No dates yet. <button class="linkbtn" data-act="edit-step" data-pid="${esc(p.id)}" data-step="schedule" data-item="">Add the start date</button> to begin.</p>`;
  evs.forEach(ev => {
    const rs = remState(ev);
    let status = '';
    if(ev.done) status = '<span class="tag quiet">Done</span>';
    else if(p.status === 'complete' || ev.noRemind) status = '';
    else if(rs.due) status = '<span class="tag">Reminder ready to send</span>';
    else if(rs.next) status = `Next reminder ${esc(fmtShort(rs.next.rd))}, ${esc(offLong(rs.next.o))} before`;
    else if(rs.d < 0) status = 'Past';
    const parts = []; if(ev.time) parts.push(fmtTime(ev.time)); parts.push(...summaryParts(ev));
    const canDone = ev.type !== 'finish';
    const doneLabel = ev.type === 'stakeholder' ? 'Contacted' : ev.type === 'start' ? 'Started' : 'Done';
    h += `<div class="trow ${ev.done ? 'is-done' : ''} ${rs.d < 0 && !ev.done ? 'is-past' : ''}" style="--cat:${catColor(ev.type)}">
      <div class="tdate tnum"><b>${esc(fmtMD(ev.date))}</b><span>${esc(fmtWD(ev.date))}</span></div>
      <div class="row-bar"></div>
      <div><div class="row-title">${esc(ev.title)}</div>${parts.length ? `<div class="row-sub">${parts.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}${status ? `<div class="row-next">${status}</div>` : ''}</div>
      <div class="row-actions">${canDone ? `<button class="btn btn-sm" data-act="toggle-done" data-pid="${esc(p.id)}" data-eid="${esc(ev.id)}" aria-pressed="${ev.done ? 'true' : 'false'}">${doneLabel}</button>` : ''}${ev.type === 'finish' ? '' : editBtn(ev)}</div>
    </div>`;
  });
  h += `</div>`;
  if(undated.length){
    h += `<h3 class="sec-h" style="font-size:19px;margin-top:26px">Needs a date</h3><div class="list">${undated.map(m => {
      const ev = {id:m.id, type:m.type, title:msTitle(m), project:p, src:m};
      return `<div class="row" style="--cat:${catColor(m.type)}"><div class="row-bar"></div><div><div class="row-title">${esc(ev.title)}</div><div class="row-sub">${summaryParts(ev).map(x => `<span>${esc(x)}</span>`).join('')}</div></div><div class="row-actions">${editBtn(ev,'Add date')}</div></div>`;
    }).join('')}</div>`;
  }
  h += `</section><section class="sec"><h2 class="sec-h">Stakeholders</h2>`;
  const sh = (p.stakeholders||[]).filter(s => (s.name||'').trim());
  if(!sh.length) h += `<p class="note">No one added yet. <button class="linkbtn" data-act="edit-step" data-pid="${esc(p.id)}" data-step="stakeholders" data-item="">Add stakeholders</button></p>`;
  else h += `<div class="list">${sh.map(s => `<div class="person"><div class="person-name">${esc(s.name)}</div>
      <div class="row-sub">${[s.role, s.company].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</div>
      ${s.preferred ? `<span class="pref">Prefers ${esc(s.preferred.toLowerCase().replace('microsoft teams','Microsoft Teams'))}</span>` : ''}
      <div class="row-sub" style="margin-top:6px">${s.phone ? `<span><a href="tel:${esc(s.phone.replace(/[^\d+]/g,''))}">${esc(s.phone)}</a></span>` : ''}${s.email ? `<span><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></span>` : ''}${s.bestTime ? `<span>Best time: ${esc(s.bestTime)}</span>` : ''}${s.contactBy ? `<span>Contact by ${esc(fmtShort(s.contactBy))}</span>` : ''}</div>
    </div>`).join('')}</div><p style="margin-top:12px"><button class="linkbtn" data-act="edit-step" data-pid="${esc(p.id)}" data-step="stakeholders" data-item="">Edit stakeholders</button></p>`;
  h += projectPlansHTML(p);
  h += `<div class="btns" style="margin-top:34px"><button class="btn" data-act="complete-project" data-id="${esc(p.id)}">${p.status === 'complete' ? 'Reopen project' : 'Mark project complete'}</button></div>`;
  h += `</section></div>`;
  return h;
}

function renderSettings(){
  const st = S.settings, off = offsets();
  const storageText = S.storage === 'db' ? 'Saved to your Claude account. Your projects will be here next time you open this page, on any device where you’re signed in.'
    : S.storage === 'loading' ? 'Connecting to your account…'
    : IN_CLAUDE ? 'Saved in this browser only. Download a backup now and then so nothing gets lost.'
    : 'Saved in this browser on this computer only. It doesn’t sync with the Claude version. Download a backup now and then, since clearing your browser data would erase it.';
  return `<div class="page-h"><div><h1>Settings</h1></div></div>
  <section class="set-sec"><div><h2>Your email</h2><p class="muted">Reminder emails open in your mail app addressed to you.</p></div>
    <div><label for="set-email">Email address</label><input id="set-email" type="email" autocomplete="email" value="${esc(st.email)}" data-change="set-email" placeholder="you@company.com"></div></section>
  <section class="set-sec"><div><h2>When reminders come</h2><p class="muted">How far ahead of each date you get a reminder. These apply to every project.</p></div>
    <div><div class="offs">${off.map(o => `<span class="off">${esc(offLong(o))} before<button data-act="off-remove" data-o="${o}" aria-label="Remove the ${esc(offLong(o))} reminder">×</button></span>`).join('') || '<span class="muted">No reminders set.</span>'}</div>
    <div class="inline"><div><label for="off-new">Days before</label><input id="off-new" type="number" min="1" max="365" inputmode="numeric" placeholder="e.g. 3"></div><button class="btn" data-act="off-add">Add reminder</button><button class="btn btn-ghost" data-act="off-reset">Reset to 1 month, 2 weeks, 1 week, 2 days</button></div></div></section>

function ensureItem(){ const s = STEPS[S.wiz.step]; if(s.kind === 'list' && !s.noAuto && !listFor(s, S.wiz.draft).length) addItem(s); }
function openWizard(pid, stepKey, itemId){

function pruned(d){

function persistDraft(){

function closeWizard(openProject){

function handleRem(key, off, status){
  const ev = S.evIndex[key]; if(!ev) return;
  const p = clone(S.projects[ev.project.id]);
  const prev = clone(p.reminderLog || {});
  p.reminderLog = p.reminderLog || {};
  const t = todayISO();
  offsets().forEach(o => { if(o >= off && addDays(ev.date, -o) <= t) p.reminderLog[ev.id+'|'+o] = {s:status, at:t}; });
  writeProject(p, {delay: status === 'sent' ? 350 : 0});
  toast(status === 'sent' ? 'Marked as sent.' : 'Reminder dismissed.', {label:'Undo', fn:() => { const q = clone(S.projects[p.id]); q.reminderLog = prev; writeProject(q); }});
}
function toggleDone(pid, eid){
  const p = clone(S.projects[pid]); if(!p) return;
  if(eid === 'start') p.startDone = !p.startDone;
  else if(Object.keys(DERIVED_DONE).some(px => eid.startsWith(px))){
    const px = Object.keys(DERIVED_DONE).find(x => eid.startsWith(x)), key = DERIVED_DONE[px];
    const m = (p.milestones||[]).find(x => px + x.id === eid); if(m) m[key] = !m[key];

  else if(eid.startsWith('sh_')){ const s = (p.stakeholders||[]).find(x => 'sh_'+x.id === eid); if(s) s.contacted = !s.contacted; }
  else { const m = (p.milestones||[]).find(x => x.id === eid); if(m) m.done = !m.done; }
  writeProject(p);
}

async function highlightedText(pg, tc){

  marks.slice(0, 40).forEach(a => {
    const x1 = Math.min(a.rect[0], a.rect[2]) - 2, x2 = Math.max(a.rect[0], a.rect[2]) + 2, y1 = Math.min(a.rect[1], a.rect[3]) - 2, y2 = Math.max(a.rect[1], a.rect[3]) + 2;
    const words = tc.items.filter(it => {
      if(!it.str || !it.transform) return false;
      const h = Math.abs(it.transform[3]) || it.height || 8;
      const cx = it.transform[4] + (it.width || 0) / 2, cy = it.transform[5] + h / 3;
      return cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2;
    }).map(it => it.str).join(' ').replace(/\s+/g,' ').trim();
    if(words && !out.includes(words)) out.push(words.slice(0, 200));
